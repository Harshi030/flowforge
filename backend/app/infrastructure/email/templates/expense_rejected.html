<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Expense Rejected</title>
</head>
<body>

    <h2>Expense Rejected</h2>

    <p>Hello {{ employee_name }},</p>

    <p>
        Your expense has been rejected.
    </p>

    <p>
        <strong>Amount:</strong> {{ amount }} {{ currency }}
    </p>

    <p>
        <strong>Reason:</strong>
        {{ rejection_reason }}
    </p>

    <p>
        Please review the rejection reason and take the necessary action.
    </p>

    <p>
        Regards,<br>
        FlowForge
    </p>

</body>
</html>
