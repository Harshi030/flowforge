services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    volumes:
      - ./backend/app:/app/app
    depends_on:
      # db:
      #   condition: service_healthy
      redis:
        condition: service_healthy

  # db:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: flowforge
  #     POSTGRES_PASSWORD: flowforge
  #     POSTGRES_DB: flowforge
  #   ports:
  #     - "5433:5432"
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U flowforge -d flowforge"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build: ./backend
    command: celery -A app.infrastructure.tasks.celery_app.celery_app worker --loglevel=info
    env_file:
      - .env.docker
    volumes:
      - ./backend/app:/app/app
    depends_on:
      redis:
        condition: service_healthy

